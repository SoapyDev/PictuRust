[package]
name = "picturust"
version = "0.2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "picturust"
path = "src/lib.rs"

[[bin]]
name = "picturust"
path = "src/main.rs"

[dependencies]
anyhow = { version = "1.0.86" }
image = "0.25.1"
jwalk = "0.9.0"
kamadak-exif = "0.6.1"
ravif = "0.13.0"
rayon = "1.10.0"
rgb = "0.8.37"
webp = "0.3.0"

[dependencies.clap]
version = "4.5.6"
features = ["derive"]
