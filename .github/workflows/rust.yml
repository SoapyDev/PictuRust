name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Install nasm
      run: sudo apt-get -y install nasm
    - uses: actions/checkout@v7
    - name: Install rustfmt and clippy
      run: rustup component add rustfmt clippy
    - uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Check formatting
      run: cargo fmt --all --check
    - name: Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings -D clippy::pedantic -D clippy::nursery

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Install nasm (Linux)
      if: runner.os == 'Linux'
      run: sudo apt-get -y install nasm
    - name: Install nasm (Windows)
      if: runner.os == 'Windows'
      run: choco install nasm -y
    - name: Add nasm to PATH (Windows)
      if: runner.os == 'Windows'
      run: echo "C:\Program Files\NASM" >> $env:GITHUB_PATH
    - uses: actions/checkout@v7
    - uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
